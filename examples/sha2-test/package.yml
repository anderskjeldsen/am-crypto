id: sha2-test
version: 1.0.0
type: application
# Exercises am-crypto's Sha256 / Hmac / Pbkdf2 bindings on real m68k.
#
# Those three are reached through AmiSSL stubs, and a stub LINKS whether
# or not the installed amissl.library actually implements the call — so a
# clean amigaos build proves nothing about HMAC() or
# PKCS5_PBKDF2_HMAC() being there. This runs the published test vectors
# on the emulator and compares them, which is also the only check that
# the digests come out right on a BIG-ENDIAN machine.
#
# The companion sha1-thread-test next door covers the other question
# (per-task AmiSSL bring-up from an AmLang worker Thread); this one
# stays on the main task and is about the algorithms.
#
# `make build && ./builds/bin/<host>/app` runs it on the host, where it
# passes; `./run-m68k.sh` runs the same binary under Amiberry. See that
# script for the AmiSSL hang that currently stops the m68k half.
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    branch: master
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
  - id: am-crypto
    type: local
    path: ../../
platforms:
  - id: libc
    abstract: true
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O3
    gccAdditionalLibraries:
      - crypto
  - id: macos
    extends: libc
    gccCommand: gcc -O3
    additionalIncludePaths:
      - /opt/homebrew/opt/openssl/include
    gccLibraryPaths:
      - /opt/homebrew/opt/openssl/lib
    gccAdditionalLibraries:
      - crypto
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O3
    additionalIncludePaths:
      - /opt/homebrew/opt/openssl/include
    gccLibraryPaths:
      - /opt/homebrew/opt/openssl/lib
    gccAdditionalLibraries:
      - crypto
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
buildTargets:
  - id: linux-x64
    platform: linux-x64
  - id: macos
    platform: macos
  - id: macos-arm
    platform: macos-arm
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
