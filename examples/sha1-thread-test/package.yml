id: sha1-thread-test
version: 1.0.0
type: application
# Exercises am-crypto's SHA-1 binding on both the main task and an
# AmLang worker Thread. Purpose: prove the per-task AmiSSL bring-up
# pattern (OpenLibrary amisslmaster + InitAmiSSL per subprocess,
# matched by CleanupAmiSSL via the Thread finalizer) works on real
# Amiga hardware / emulators — without dragging the network stack in.
# Tests Sha1.digest(...) is callable from a worker Thread that has
# NEVER touched bsdsocket, only OpenSSL via AmiSSL.
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    branch: master
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
  - id: am-crypto
    type: local
    path: ../../
platforms:
  - id: libc
    abstract: true
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O3
    gccAdditionalLibraries:
      - crypto
  - id: macos
    extends: libc
    gccCommand: gcc -O3
    additionalIncludePaths:
      - /opt/homebrew/opt/openssl/include
    gccLibraryPaths:
      - /opt/homebrew/opt/openssl/lib
    gccAdditionalLibraries:
      - crypto
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O3
    additionalIncludePaths:
      - /opt/homebrew/opt/openssl/include
    gccLibraryPaths:
      - /opt/homebrew/opt/openssl/lib
    gccAdditionalLibraries:
      - crypto
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
buildTargets:
  - id: linux-x64
    platform: linux-x64
  - id: macos
    platform: macos
  - id: macos-arm
    platform: macos-arm
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
